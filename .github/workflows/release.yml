name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: Release version (e.g. 1.0.0) — used as tag v<version>
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4
        with:
          # ModDevGradle 2.x requires Gradle 9.x
          gradle-version: 9.2.1

      - name: Build with Gradle
        run: |
          set -o pipefail
          gradle build --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Verify jar exists
        run: ls -la build/libs/

      - name: Create GitHub Release with jar
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF_NAME}"
            TARGET="$GITHUB_REF_NAME"
          else
            VERSION="v${{ inputs.version }}"
            TARGET="$GITHUB_SHA"
          fi
          echo "Releasing $VERSION (target $TARGET)"
          gh release create "$VERSION" build/libs/*.jar \
            --target "$TARGET" \
            --title "MystPages $VERSION" \
            --notes "MystPages $VERSION — NeoForge 1.21.1 addon for Mystcraft Reborn (mystcraft_reborn).

- Detects modded ores, fluids and structures and adds them as pages on Descriptive Books.
- Sable sub-level portal compatibility (portals on sub-levels, players on sub-levels through portals).

Built with Gradle 9.2.1 + ModDevGradle on JDK 21 against MC 1.21.1 / NeoForge 21.1.68." \
            --latest
