name: Build

on:
  push:
    branches: [arena/cd144340-mystaddon]
    tags: ['v*']
  pull_request:
    branches: [ShadowClanGaming]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4
        with:
          # ModDevGradle 2.x requires Gradle 9.x (same as the reference port's wrapper)
          gradle-version: 9.2.1

      - name: Build with Gradle
        run: |
          set -o pipefail
          gradle build --no-daemon --stacktrace 2>&1 | tee build.log

      # Emit the log tail as error annotations so it is visible via `gh run view`.
      - name: Report build failure
        if: failure()
        continue-on-error: true
        run: |
          echo "::group::Gradle log tail"
          tail -n 120 build.log
          echo "::endgroup::"
          while IFS= read -r line; do echo "::error ::$line"; done < <(grep -iE -A2 "what went wrong|could not|error|failure|caused by" build.log | tail -n 60)

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mystpages-jar
          path: build/libs/*.jar
          if-no-files-found: warn

  # Creates a GitHub Release with the built jar on v* tags (and on manual dispatch).
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: mystpages-jar
          path: dist

      - name: Create GitHub Release with jar
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          TARGET_ARGS=""
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF_NAME}"
            # For tag events the release target defaults to the tag's commit;
            # passing the tag name as --target is rejected (target_commitish invalid).
          else
            VERSION="v$(grep '^mod_version=' gradle.properties | cut -d= -f2)"
            TARGET_ARGS="--target $GITHUB_SHA"
          fi
          echo "Releasing $VERSION $TARGET_ARGS"
          ls -la dist/
          gh release create "$VERSION" dist/*.jar \
            $TARGET_ARGS \
            --title "MystPages $VERSION" \
            --notes "MystPages $VERSION — NeoForge 1.21.1 addon for Mystcraft Reborn (mystcraft_reborn).

            - Detects modded ores, fluids and structures and adds them as pages on Descriptive Books.
            - Sable sub-level portal compatibility (portals on sub-levels, players on sub-levels through portals).

            Built with Gradle 9.2.1 + ModDevGradle on JDK 21 against MC 1.21.1 / NeoForge 21.1.68." \
            --latest 2>&1 | tee release.log || { while IFS= read -r line; do echo "::error ::$line"; done < <(tail -n 30 release.log); { echo '### gh release failed'; echo '```'; tail -n 30 release.log; echo '```'; echo "ls dist:"; ls -la dist/; } >> "$GITHUB_STEP_SUMMARY"; exit 1; }
