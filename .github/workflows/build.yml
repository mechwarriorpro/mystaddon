name: Build

on:
  push:
    branches: [arena/cd144340-mystaddon]
  pull_request:
    branches: [ShadowClanGaming]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4
        with:
          # ModDevGradle 2.x requires Gradle 9.x (same as the reference port's wrapper)
          gradle-version: 9.2.1

      - name: Build with Gradle
        run: |
          set -o pipefail
          gradle build --no-daemon --stacktrace 2>&1 | tee build.log

      # Emit the log tail as error annotations so it is visible via `gh run view`.
      - name: Report build failure
        if: failure()
        continue-on-error: true
        run: |
          echo "::group::Gradle log tail"
          tail -n 120 build.log
          echo "::endgroup::"
          while IFS= read -r line; do echo "::error ::$line"; done < <(grep -iE "what went wrong|could not|error|failure|caused by" build.log | tail -n 40)

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mystpages-jar
          path: build/libs/*.jar
          if-no-files-found: warn
