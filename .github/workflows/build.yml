name: Build

on:
  push:
    branches: [arena/cd144340-mystaddon]
  pull_request:
    branches: [ShadowClanGaming]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4
        with:
          # ModDevGradle 2.x requires Gradle 9.x (same as the reference port's wrapper)
          gradle-version: 9.2.1

      - name: Build with Gradle
        run: |
          set -o pipefail
          gradle build --no-daemon --stacktrace 2>&1 | tee build.log

      # Post the log tail as a commit comment so failures are visible via the API.
      - name: Report build failure
        if: failure()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          jq -n --arg b "$(tail -n 200 build.log)" '{body: ("#### Gradle build failed — log tail:\n```\n" + $b + "\n```")}' > /tmp/comment.json
          gh api -X POST repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/comments --input /tmp/comment.json || echo "comment post failed"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mystpages-jar
          path: build/libs/*.jar
          if-no-files-found: warn
