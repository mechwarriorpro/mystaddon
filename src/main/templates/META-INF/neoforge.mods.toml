modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"
issueTrackerURL="https://github.com/mechwarriorpro/mystaddon/issues"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description='''${mod_description}

Detects modded ores (by name and the c:ores tag), modded fluids and modded structures,
and adds them as pages on Mystcraft Reborn Descriptive Books for those generation types.'''

[[dependencies.${mod_id}]]
modId="neoforge"
type="required"
versionRange="[${neo_version},)"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"

# Host mod: StudioRewired/mystcraft-reborn (CurseForge "Mystcraft Reborn" / Rewired BETA line).
[[dependencies.${mod_id}]]
modId="mystcraft_reborn"
type="required"
versionRange="[1.0,)"
ordering="AFTER"
side="BOTH"

# Optional: Sable (sub-levels / moving structures). Enables portal-on-sub-level support.
[[dependencies.${mod_id}]]
modId="sable"
type="optional"
versionRange="[2.0,)"
ordering="AFTER"
side="BOTH"
